name: Deploy Godot Web Build to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Clean up unused assets before export
        run: |
          rm -rf assets/3dassets/abandoned-spaceship-demo
          rm -rf Scenes/Unused
          rm -rf Scenes/*.exr*
          rm -rf Materials/Videos
          rm -rf Materials/Outside
          rm -rf Materials/Vegetation
          rm -rf artifacts
          find . -name "*.7z" -delete -o -name "*.rar" -delete

      - name: Export Godot Web
        id: godot_export
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          godot_export_templates_download_url: "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          relative_project_path: "./"
          archive_output: false

      - name: Locate and prepare Web export files
        run: |
          mkdir -p public_html
          
          # Find index.html anywhere in runner or build dirs
          INDEX_PATH="$(find . "${{ steps.godot_export.outputs.build_directory }}" /root -name "index.html" 2>/dev/null | head -n 1)"
          if [ -z "$INDEX_PATH" ]; then
            echo "::error::Could not find exported index.html"
            exit 1
          fi
          
          SOURCE_DIR="$(dirname "$INDEX_PATH")"
          echo "Found exported files in: $SOURCE_DIR"
          ls -la "$SOURCE_DIR"
          
          # Copy all exported web files to public_html
          cp -r "$SOURCE_DIR"/* public_html/
          
          # Ensure index.html exists in public_html root
          if [ ! -f public_html/index.html ]; then
            INDEX_NESTED="$(find public_html -name "index.html" | head -n 1)"
            if [ -n "$INDEX_NESTED" ]; then
              cp -r "$(dirname "$INDEX_NESTED")"/* public_html/
            fi
          fi

      - name: Install coi-serviceworker (Required for WebAssembly / SharedArrayBuffer)
        run: |
          curl -fsSL https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.min.js -o public_html/coi-serviceworker.min.js
          if [ -f public_html/index.html ]; then
            sed -i 's/<head>/<head><script src="coi-serviceworker.min.js"><\/script>/' public_html/index.html
          fi
          echo "=== Content of public_html ==="
          ls -la public_html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public_html

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
