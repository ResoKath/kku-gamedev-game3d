name: Deploy Godot Web Build to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Godot and Export Web
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          godot_export_templates_download_url: "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          relative_project_path: "./"
          use_preset_export_path: true
          archive_output: false

      - name: Verify Web export
        run: |
          test -s build/web/index.html
          test -n "$(find build/web -maxdepth 1 -type f \( -name '*.pck' -o -name '*.wasm' \) -print -quit)"

      - name: Install coi-serviceworker (Required for WebAssembly / SharedArrayBuffer)
        run: |
          mkdir -p build/web
          curl -fsSL https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.min.js -o build/web/coi-serviceworker.min.js
          if [ -f build/web/index.html ]; then
            sed -i 's/<head>/<head><script src="coi-serviceworker.min.js"><\/script>/' build/web/index.html
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

